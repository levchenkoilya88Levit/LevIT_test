# Налаштування сайту LevIT (Jekyll, збирається GitHub Pages автоматично)
title: LevIT
description: Супровід, доробка, інтеграції та аудит BAS для українського бізнесу.
url: https://levchenkoilya88levit.github.io
baseurl: "/LevIT_test"
lang: uk
env: dev           # ТЕСТОВЫЙ САЙТ (LevIT_test). Этот коммит в прод не переносится

markdown: kramdown
kramdown:
  input: GFM

collections:
  solutions:            # Готові рішення: файли в папці _solutions
    output: true
    permalink: /poslugy/gotovi-rishennya/:name/
  cases:                # Кейси: файли в папці _cases
    output: true
    permalink: /keisy/:name/

defaults:
  - scope: { path: "", type: solutions }
    values: { layout: solution, form_class: alt }
  - scope: { path: "", type: cases }
    values: { layout: case, form_class: alt }
  - scope: { path: "" }
    values: { layout: default }

exclude:
  - integrations
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
